[project]
name = "replayable-mini-rag-pipeline"
version = "1.0.0"
description = "Deterministic, observable replayable mini RAG pipeline with stage-wise auditing and human override checkpoints"
readme = "final_report.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
